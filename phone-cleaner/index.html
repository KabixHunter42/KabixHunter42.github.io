<!doctype html>
<html lang="en">
<head>

  <title>Phone Cleaner - Privacy Policy</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="shortcut icon" type="image/png" href="logo.png">
  <style>
    :root { color-scheme: light dark; --blue: #2563eb; --ink: #111827; --muted: #6b7280; --surface: #ffffff; --page: #f7f9fc; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f8fafc; --muted: #cbd5e1; --surface: #1e293b; --page: #0f172a; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(680px, calc(100% - 32px)); margin: 72px auto; padding: 32px; background: var(--surface); border-radius: 24px; }
    h1 { margin-top: 0; font-size: 2rem; display: flex; align-items: center; gap: 16px; }
    .icon { width: 48px; height: 48px; border-radius: 12px; }
    a { color: var(--blue); }
  </style>
</head>
<body>
  <main>
    <h1><img src="logo.png" alt="Phone Cleaner" class="icon"> Phone Cleaner</h1>
    <p>Please review our legal documents.</p>
    <p><a href="privacy-policy.html">Privacy Policy</a></p>
  </main>
